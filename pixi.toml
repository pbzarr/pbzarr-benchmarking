[workspace]
authors = ["Cade Mirchandani <cademirch@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "pbzarr-benchmarking"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.13,<3.14"
snakemake = ">=9.27.0,<10"
mosdepth = ">=0.3.14,<0.4"
d4tools = ">=0.3.11.post0,<0.4"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.11.2,<4"
pybigwig = ">=0.3.26,<0.4"
deeptools = ">=3.5.6,<4"
dask = "*"
distributed = "*"
xarray = "*"
zarr = ">=3,<4"
numcodecs = "*"
flox = ">=0.9,<0.11"
go-yq = ">=4.54.1,<5"

[target.linux-64.dependencies]
megadepth = ">=1.2.0,<2"
# bedtools random makes the random-region BEDs for the region scans.
bedtools = ">=2.31.1,<3"

[pypi-dependencies]
# pyd4 from the fork: builds without htslib. Pinned for reproducibility.
pyd4 = { git = "https://github.com/cademirch/d4-format.git", rev = "72afdae", subdirectory = "pyd4" }
# pbzarr Python API on main (format 0.4). The benchmark stores use pcodec,
# which zarr-python decodes through numcodecs + pcodec.
pbzarr = { git = "https://github.com/pbzarr/pbzarr.git", rev = "b059a35" }
pcodec = "*"
zarrs = ">=0.2.3, <0.3"
