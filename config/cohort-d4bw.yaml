# Overnight run 2026-10-21: D4 and BigWig only, 32-256 samples (Cade).
# At N=256 the packing is 1 thread x 256 jobs, the floor(cores / N) rule
# continued, chosen before part 1 exists. PBZ runs separately later.
manifest: config/1kg-sr.tsv
crams_dir: /scratch/ucgd/lustre-labs/vollger/data-sets/1kg-high-coverage/crams
reference: /scratch/ucgd/lustre-labs/vollger/assemblies/GRCh38_full_analysis_set_plus_decoy_hla.fa
chrom_sizes: /scratch/ucgd/lustre-labs/vollger/assemblies/GRCh38_full_analysis_set_plus_decoy_hla.chrom.sizes
regions_bed: random.bed
pbz: /uufs/chpc.utah.edu/common/HIPAA/u1364833/pbzarr/target/release/pbz
pbz_repo: /uufs/chpc.utah.edu/common/HIPAA/u1364833/pbzarr
codecs: codecs.json
cores: 256
results: results/cohort-d4bw
sample_counts: [32, 64, 128, 256]
noise_check: {n: 256, builds: 3}
scan_trials: 3
# Each tool's scans in a part 2 job stop after this many hours (see part2.sbatch).
scan_timeout_hours: 16
tools: [d4, bigwig]
disk_per_sample_gb: 6
# D4 and BigWig builds with N >= cores: threads per job and jobs at once. Set by
# hand from part 1's results (results/single/runs.tsv). Below that, part2.sbatch
# runs N jobs of floor(cores / N) threads. Left null, part2.sbatch refuses to
# start a build that needs them.
packing: {d4: {threads: 1, jobs: 256}, bigwig: {threads: 1, jobs: 256}}
